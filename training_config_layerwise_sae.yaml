# Per-layer BatchTopK SAEs on ProtT5, the comparison point for roadmap PP-06a.
#
# Run with crosscode/trainers/topk_layerwise_sae/run.py (scripts/submit_layerwise_sae.sh). One job
# trains one SAE for each hookpoint below from one shared ProtT5 harvest. Each SAE has the settings
# of the full-UniRef50 crosscoder (training_config_full_uniref.yaml): 8192 latents, BatchTopK k=32,
# batch 512, AuxK k_aux=512 lambda_aux=1/32, dead threshold 5e6, Adam lr 5e-5, betas (0, 0.999),
# 5 % warmup, 20 % warmdown, the same norm estimate (sqrt(d_model) / mean norm, per hookpoint).
#
# Data: chunk_00.fasta only, one epoch. That is 1,126,023,651 residues (chunks_512/manifest.json).
# The crosscoder trained on the same file first, with the same harvest batch, shuffle buffer and
# shuffle seed. Thus each SAE sees the residues and batches of crosscoder chunk 0 in the same order.
# num_steps is the global budget of the crosscoder, so the LR at each step is the LR of the
# crosscoder. The data runs out at step 2,199,187, the last step of crosscoder chunk 0 (job
# 5698767). Thus each final SAE pairs with crosscoder_l8192_k32_bs512_full_uniref_chunk0/
# final_epoch_0_step_2199187. For an SAE with its own full schedule, set num_steps: 2_199_187.
#
# Layers: the InterPLM ESM-2-650M depths mapped to 24 layers, with 16 for 17 and without layer 1.
# Layer 16 occurs two times: the second SAE is a seed-variance pair. The reasons are in
# documentation/experiments/12-per-layer-sae-comparison.md.
data:
  token_sequence_loader:
    type: "fasta"
    fasta_path: "/workspace/data/external/uniprot/release-2019_01/uniref/uniref50/chunks_512/chunk_00.fasta"
    max_sequence_length: 512
  activations_harvester:
    llms:
      - hf_model_name: Rostlab/prot_t5_xl_uniref50
        base_architecture_name: T5ForConditionalGeneration
    harvesting_batch_size: 128
    inference_dtype: float32
    cache_mode: "no_cache"
  activations_shuffle_buffer_size: 400_000
  n_tokens_for_norm_estimate: 100_000
crosscoder:
  n_latents: 8192
  k: 32
  init_strategy: "anthropic_transpose"
  dec_init_norm: 0.1
train:
  batch_size: 512
  num_steps: 10_990_430 # the crosscoder schedule. The data ends at step 2,199,187
  save_every_n_steps: 629_973 # the crosscoder value: saves at the same steps as its chunk 0
  log_every_n_steps: 10
  topk_style: "batch_topk"
  dead_latents_threshold_n_examples: 5_000_000
  k_aux: 512
  lambda_aux: 0.03125
experiment_name: "sae_l8192_k32_bs512_layerwise_uniref_chunk0"
append_timestamp: false
seed: 42
wandb:
  entity: "sohrab-train"
  project: "crosscoders-protT5"
base_save_dir: "/workspace/model_checkpoints"
cache_dir: "/workspace/hf_home/"
hookpoints: [
  "encoder.blocks.7.hook_resid_post",
  "encoder.blocks.13.hook_resid_post",
  "encoder.blocks.16.hook_resid_post",
  "encoder.blocks.16.hook_resid_post",
  "encoder.blocks.22.hook_resid_post",
  "encoder.blocks.24.hook_resid_post"
]

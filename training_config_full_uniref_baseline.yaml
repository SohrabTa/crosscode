# RANDOM-INIT BASELINE at full-UniRef50 scale. Byte-for-byte the same run as
# training_config_full_uniref.yaml except that the ProtT5 weights are SHUFFLED
# before harvesting (randomize_weights, seed 42 -> shuffle_model_weights in
# crosscode/llms/__init__.py:65). It is the matched null for the preprint
# crosscoder: same corpus, same 10,990,430-step budget, same architecture, so
# any downstream difference is attributable to the model weights alone.
#
# Full UniRef50 2019_01 (<=512 AA) chunked-resume training config.
#
# Corpus: 27,802,977 sequences / 5.63 B residues, split by chunk_uniref_corpus.py
# into 5 balanced chunks (data/.../uniref/uniref50/chunks_512/chunk_0X.fasta).
# num_steps below is the GLOBAL one-epoch budget over the whole corpus
# (5,627,100,434 residues / 512 = 10,990,430). Each Slurm job trains one chunk
# (~2.20 M steps, ~29 h at the measured 20.8 steps/s sustained; -t 34h) and resumes from the
# previous chunk's checkpoint, so the global step counter and LR schedule span the
# entire run. See submit_chunk.sh / run_full_uniref_chunks.sh. Architecture is HELD FIXED vs the hand-in (auxfix)
# run: TopK/BatchTopK, 8192 latents, k=32, AuxK active.
#
# submit_chunk.sh overrides per chunk: data.token_sequence_loader.fasta_path,
# experiment_name, and train.resume_from. append_timestamp is False so each
# chunk writes to a deterministic save_dir the next chunk can locate.
data:
  token_sequence_loader:
    type: "fasta"
    fasta_path: "/workspace/data/uniprot/release-2019_01/uniref/uniref50/chunks_512/chunk_00.fasta"
    max_sequence_length: 512
  activations_harvester:
    llms:
      - hf_model_name: Rostlab/prot_t5_xl_uniref50
        base_architecture_name: T5ForConditionalGeneration
        randomize_weights: true
        randomize_weights_seed: 42
    harvesting_batch_size: 128
    cache_mode: "no_cache"
  activations_shuffle_buffer_size: 400_000
crosscoder:
  n_latents: 8192
  k: 32
train:
  # 512 residues per batch x 10_990_430 batches = 5_627_100_434 residues (full <=512 corpus, 1 epoch)
  batch_size: 512
  num_steps: 10_990_430
  save_every_n_steps: 629_973
  log_every_n_steps: 10
  topk_style: "batch_topk"
  dead_latents_threshold_n_examples: 5_000_000
  k_aux: 512 # heuristic model_dim / 2
  lambda_aux: 0.03125 # 1/32
  resume_from: null   # set by submit_chunk.sh for chunks 1..4
experiment_name: "crosscoder_l8192_k32_bs512_baseline_uniref_chunk0"  # overridden per chunk
append_timestamp: false   # deterministic save_dir per chunk (chunked resume)
wandb:
  entity: "sohrab-train"
  project: "crosscoders-protT5"
base_save_dir: "/workspace/model_checkpoints"
cache_dir: "/workspace/hf_home/"
hookpoints: [
  "encoder.blocks.1.hook_resid_post",
  "encoder.blocks.2.hook_resid_post",
  "encoder.blocks.3.hook_resid_post",
  "encoder.blocks.4.hook_resid_post",
  "encoder.blocks.5.hook_resid_post",
  "encoder.blocks.6.hook_resid_post",
  "encoder.blocks.7.hook_resid_post",
  "encoder.blocks.8.hook_resid_post",
  "encoder.blocks.9.hook_resid_post",
  "encoder.blocks.10.hook_resid_post",
  "encoder.blocks.11.hook_resid_post",
  "encoder.blocks.12.hook_resid_post",
  "encoder.blocks.13.hook_resid_post",
  "encoder.blocks.14.hook_resid_post",
  "encoder.blocks.15.hook_resid_post",
